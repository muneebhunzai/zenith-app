name: zenith_life
description: "A private, standalone, offline-first personal management Android app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Local SQLite Storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  
  # Date & Formatting
  intl: ^0.19.0
  
  # Local Notifications & Alarms
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  
  # Charts & Visualizations
  fl_chart: ^0.68.0
  
  # CSV Export
  csv: ^6.0.0
  
  # Secure Key-Value Store & Cryptography
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  
  # Markdown Note Rendering
  flutter_markdown: ^0.7.3

  # UI Icons & Styling
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
